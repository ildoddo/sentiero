{% extends "base.html" %}
{% block titolo %}Accesso · Sentiero{% endblock %}
{% block contenuto %}
<h1>Accesso</h1>
{% if errore %}
<p class="errore" role="alert">Email o password non corretti.</p>
{% endif %}
<form method="post" action="/login" class="colonna">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <label>Email
    <input type="email" name="email" required autofocus autocomplete="username">
  </label>
  <label>Password
    <input type="password" name="password" required autocomplete="current-password">
  </label>
  <button type="submit">Accedi</button>
</form>
{% endblock %}
