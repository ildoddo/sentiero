{% extends "base.html" %}
{% block intestazione %}
<nav aria-label="Menu principale">
  {% if utente.ruolo == Ruolo::Admin %}
  <a href="/admin/classi">Classi</a>
  <a href="/admin/docenti">Docenti</a>
  <a href="/admin/alunni">Alunni</a>
  <a href="/admin/cdc">Consigli di Classe</a>
  <a href="/admin/modelli">Modelli PFI</a>
  <a href="/admin/assegnazioni">Assegnazioni</a>
  {% endif %}
</nav>
<form method="post" action="/logout" class="utente">
  <span>{{ utente.nome }} {{ utente.cognome }}</span>
  <input type="hidden" name="_csrf" value="{{ utente.csrf }}">
  <button type="submit">Esci</button>
</form>
{% endblock %}
