# Compila l'app desktop `sentiero-tutor` per Windows e macOS.
# - Push di un tag `v*`: compila e pubblica una release GitHub con i due zip.
# - Avvio manuale (Actions > Release > Run workflow): compila soltanto; gli zip restano
#   scaricabili dalla pagina dell'esecuzione. Utile per provare prima di creare un tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Sentiero-windows-x64
          - os: macos-latest
            artifact: Sentiero-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Aggiorna Rust
        run: rustup update stable

      - name: Compila (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked --features finestra --bin sentiero-tutor
          Copy-Item target/release/sentiero-tutor.exe Sentiero.exe
          Compress-Archive -Path Sentiero.exe -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Compila (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/crea-app.sh
          # ditto conserva la firma e i metadati del pacchetto, che zip perderebbe.
          ditto -c -k --keepParent target/release/Sentiero.app "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "Sentiero $GITHUB_REF_NAME"
          --generate-notes
          *.zip
